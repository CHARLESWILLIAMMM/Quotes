<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f0e8" />
    <meta name="description" content="A new inspiring quote every day from great philosophers and writers." />
    <title>The Thinker's Daily Quote</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
  </head>
  <body>
    <main class="card" aria-live="polite">
      <p class="date-label" id="dateLabel"></p>
      <blockquote class="quote" id="quoteText"></blockquote>
      <p class="author" id="quoteAuthor"></p>
      <div class="actions">
        <button class="btn" id="copyBtn" aria-label="Copy today's quote to clipboard">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M16 1H4a2 2 0 0 0-2 2v14h2V3h12V1zm3 4H8a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zm0 16H8V7h11v14z"/>
          </svg>
          Copy
        </button>
        <button class="btn btn-share" id="shareBtn" aria-label="Share today's quote">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M18 16a3 3 0 0 0-2.04.8L8.91 12.7A3.1 3.1 0 0 0 9 12a3.1 3.1 0 0 0-.09-.7l7.05-4.1A3 3 0 1 0 14 5a3.1 3.1 0 0 0 .09.7L7.04 9.8A3 3 0 1 0 7 12a3.1 3.1 0 0 0-.04-.5l7.05-4.1A3 3 0 1 0 18 16z"/>
          </svg>
          Share
        </button>
      </div>
      <p class="toast" id="toast" role="status" aria-live="polite"></p>
    </main>
    <footer>
      <p>A new thought, every day.</p>
    </footer>
    <script src="app.js"></script>
  </body>
</html>
