<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d0c1d" />
    <meta name="description" content="A new inspiring quote every day from great philosophers and writers." />
    <title>The Thinker's Daily Quote</title>

    <!-- Preconnect to Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,600&family=Inter:wght@300;400;500&display=swap" />

    <link rel="stylesheet" href="styles.css" />
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
  </head>
  <body>

    <!-- Background ambient orbs -->
    <div class="bg-orb bg-orb--1" aria-hidden="true"></div>
    <div class="bg-orb bg-orb--2" aria-hidden="true"></div>

    <div class="page-wrap">
      <header class="site-header">
        <span class="site-logo" aria-hidden="true">✦</span>
        <span class="site-name">The Thinker</span>
      </header>

      <main class="card" aria-live="polite">
        <!-- decorative big open-quote -->
        <span class="deco-quote" aria-hidden="true">&ldquo;</span>

        <p class="date-label" id="dateLabel"></p>

        <blockquote class="quote" id="quoteText"></blockquote>

        <footer class="card-footer">
          <span class="author-line" id="quoteAuthor"></span>
        </footer>

        <div class="actions">
          <button class="btn btn--copy" id="copyBtn" aria-label="Copy today's quote to clipboard">
            <!-- copy icon -->
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M16 1H4a2 2 0 0 0-2 2v14h2V3h12V1zm3 4H8a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zm0 16H8V7h11v14z"/>
            </svg>
            Copy
          </button>
          <button class="btn btn--share" id="shareBtn" aria-label="Share today's quote">
            <!-- share icon -->
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M18 16a3 3 0 0 0-2.04.8L8.91 12.7A3.1 3.1 0 0 0 9 12a3.1 3.1 0 0 0-.09-.7l7.05-4.1A3 3 0 1 0 14 5a3.1 3.1 0 0 0 .09.7L7.04 9.8A3 3 0 1 0 7 12a3.1 3.1 0 0 0-.04-.5l7.05-4.1A3 3 0 1 0 18 16z"/>
            </svg>
            Share
          </button>
        </div>

        <p class="toast" id="toast" role="status" aria-live="polite"></p>
      </main>

      <footer class="site-footer">
        <p>A new thought, every day &nbsp;·&nbsp; <span id="quoteIndex"></span></p>
      </footer>
    </div>

    <script src="app.js"></script>
  </body>
</html>
